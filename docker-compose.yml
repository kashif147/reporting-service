services:
  reporting-postgres:
    image: postgres:16
    container_name: reporting-postgres
    restart: always
    env_file:
      - /home/deploy/config/.env.common
      - .env.staging
    volumes:
      - reporting_postgres_data:/var/lib/postgresql/data
    networks:
      - gateway_app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting_user -d reporting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  reporting-service:
    container_name: reporting-service
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4005:4005"
    restart: always
    depends_on:
      reporting-postgres:
        condition: service_healthy
    env_file:
      - /home/deploy/config/.env.common
      - .env.staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gateway_app-net

volumes:
  reporting_postgres_data:

networks:
  gateway_app-net:
    external: true
