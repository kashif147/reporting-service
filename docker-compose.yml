services:
  reporting-postgres:
    image: postgres:16
    container_name: reporting-postgres
    restart: always
    env_file:
      - /home/deploy/config/.env.common
      - .env.staging
    ports:
      - "5432:5432"
    volumes:
      - reporting_postgres_data:/var/lib/postgresql/data
    networks:
      - gateway_app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports_admin -d reporting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  reporting-service:
    container_name: reporting-service
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4005:4005"
    volumes:
      - ../../logs:/var/log/projectshell
    restart: always
    depends_on:
      reporting-postgres:
        condition: service_healthy
    env_file:
      - ${ENV_COMMON_PATH:-../../config/.env.common}
      - .env.staging
    environment:
      RUN_REPORTING_MIGRATIONS: "true"
      ENABLE_REPORTING_CRON: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gateway_app-net
  pgadmin:
    image: dpage/pgadmin4
    container_name: reporting-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - reporting-postgres
    networks:
      - gateway_app-net
volumes:
  reporting_postgres_data:

networks:
  gateway_app-net:
    external: true
